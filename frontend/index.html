<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniPay | Payment & Notification Engine</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 18px;background:#f5f7fb;color:#172033}
    .card{background:white;padding:24px;border-radius:14px;box-shadow:0 4px 20px #14213d12;margin:16px 0}
    input,button{font:inherit;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ccd3df}
    input{display:block;width:min(100%,360px);box-sizing:border-box}button{background:#173e8a;color:white;border:0;cursor:pointer}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101827;color:#e6edf7;padding:14px;border-radius:8px}
    .muted{color:#5b6577}
  </style>
</head>
<body>
  <h1>MiniPay</h1>
  <p class="muted">Demo payment API with notification logging. No real money is processed.</p>
  <div class="card">
    <h2>Simulate a payment</h2>
    <form id="payment-form">
      <label>Customer<input id="customer" value="Exam User" required></label>
      <label>Amount (INR)<input id="amount" type="number" min="0.01" step="0.01" value="125.50" required></label>
      <button type="submit">Submit payment</button>
    </form>
    <pre id="result">Ready.</pre>
  </div>
  <div class="card">
    <h2>Service health</h2>
    <button id="health-button">Check backend</button>
    <pre id="health-result">Not checked yet.</pre>
  </div>
<script>
const result = document.getElementById('result');
document.getElementById('payment-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  result.textContent = 'Submitting...';
  try {
    const response = await fetch('/api/payments', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        customer: document.getElementById('customer').value,
        amount: Number(document.getElementById('amount').value)
      })
    });
    const body = await response.json();
    result.textContent = JSON.stringify(body, null, 2);
  } catch (error) { result.textContent = String(error); }
});
document.getElementById('health-button').addEventListener('click', async () => {
  const output = document.getElementById('health-result');
  try {
    const response = await fetch('/api/health');
    output.textContent = JSON.stringify(await response.json(), null, 2);
  } catch (error) { output.textContent = String(error); }
});
</script>
</body>
</html>
