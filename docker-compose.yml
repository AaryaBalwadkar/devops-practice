services:
  payment-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: minipay-backend:v1.0
    ports:
      - "5000:5000"
  payment-frontend:
    build:
      context: ./frontend
    image: minipay-frontend:v1.0
    ports:
      - "8080:80"
    depends_on:
      - payment-backend
